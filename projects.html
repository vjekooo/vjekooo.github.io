<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>projects</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-background: #F8F8FF;
      --color-accent: #000;
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const currentPage = window.location.pathname.split('/').pop() || 'index.html';
      const navLinks = document.querySelectorAll('.nav-link');
      navLinks.forEach(link => {
        const href = link.getAttribute('href');
        if (href === currentPage) {
            link.classList.add(
                'relative',
                'after:content-["\u2022"]',
                'after:absolute',
                'after:bottom-0',
                'after:right-[-10px]',
                'after:text-accent'
            );
        }
      });
    });
  </script>
</head>
<body class="font-mono bg-background text-accent p-5">
<div class="container mx-auto">
  <div class="w-1/3 flex gap-6 mb-12">
    <a href="index.html" class="nav-link flex justify-center items-center gap-4 pb-[3px] relative text-accent">About</a>
    <a href="projects.html" class="nav-link flex justify-center items-center gap-4 pb-[3px] relative text-accent">Projects</a>
  </div>
  <div class="w-full lg:w-2/3">
    <section id="projects">
      <ul class="space-y-3">
        <li><a href="https://www.fiona.com" target="_blank">Fiona</a></li>
        <li><a href="https://www.shpock.com" target="_blank">Shpock</a></li>
        <li><a href="https://inrento.com" target="_blank">InRento</a></li>
        <li><a href="https://www.docscheduler.com" target="_blank">DocScheduler</a></li>
      </ul>
    </section>
  </div>
</div>
</body>
</html>
